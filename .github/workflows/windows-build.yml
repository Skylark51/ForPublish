name: Windows build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm --onefile --noconsole --name ForPublish app.py
      - name: Check executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ForPublish.exe)) { throw 'Windows build did not produce ForPublish.exe' }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ForPublish-Windows
          path: dist/ForPublish.exe
          if-no-files-found: error
          retention-days: 30
